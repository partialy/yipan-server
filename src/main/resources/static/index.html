<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1>文件预览 </h1>
<div>
    <input type="text" id="fileId" placeholder="请输入文件ID">
    <button onclick="previewFile()">预览文件</button>
    <div id="previewContainer"></div>
</div>
<h1>文件下载 </h1>
<div>
    文件ID: <input type="text" id="downloadFileId" value="2be51b41-670c-4b53-ab43-5b1aad965edb">
    <button id="downloadFile" style="height: 30px;width: 100px;background-color: #007bff;color: white;border: none;border-radius: 5px;cursor: pointer;" onclick="downloadFile()">下载文件（流式传输）</button>
</div>
</body>
<script src="jquery-3.7.1.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
<script>
    // download
    async function downloadFile() {
        const downloadId = document.getElementById('downloadFileId').value;
        if (!downloadId) {
            alert('请输入下载ID');
            return;
        }
        window.location.href = `/api/file/download/${downloadId}`;
    }

    // preview
    function previewFile() {
        const fileId = document.getElementById('fileId').value;
        if (!fileId) {
            alert('请选择要预览的文件');
            return;
        }

        const fileName = 'h3R3 - 先说谎的人.mp4';

        // 对于图片、PDF等可以直接预览的文件
        const previewUrl = `/api/file/preview/${fileId}`;

        // 根据文件类型选择不同的预览方式
        if (isImage(fileName)) {
            // 图片预览
            const img = document.createElement('img');
            img.src = previewUrl;
            document.getElementById('previewContainer').appendChild(img);
        } else if (isPdf(fileName)) {
            // PDF预览
            const iframe = document.createElement('iframe');
            iframe.src = previewUrl;
            iframe.style.width = '100%';
            iframe.style.height = '600px';
            document.getElementById('previewContainer').appendChild(iframe);
        } else if (isVideo(fileName)) {
            // 视频预览
            const video = document.createElement('video');
            video.src = previewUrl;
            video.controls = true;
            document.getElementById('previewContainer').appendChild(video);
        } else if (isAudio(fileName)) {
            // 音频预览
            const audio = document.createElement('audio');
            audio.src = previewUrl;
            audio.controls = true;
            document.getElementById('previewContainer').appendChild(audio);
        } else {
            // 其他类型文件可能需要下载后查看
            alert('该文件类型暂不支持在线预览');
        }
    }

    // 文件类型判断辅助函数
    function isImage(fileName) {
        return /\.(jpg|jpeg|png|gif|bmp|webp)$/i.test(fileName);
    }

    function isPdf(fileName) {
        return /\.pdf$/i.test(fileName);
    }

    function isVideo(fileName) {
        return /\.(mp4|webm|ogg)$/i.test(fileName);
    }

    function isAudio(fileName) {
        return /\.(flac|mp3|wav|ogg)$/i.test(fileName);
    }
</script>
</html>
